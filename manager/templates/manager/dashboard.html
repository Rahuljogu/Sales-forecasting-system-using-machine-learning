{% extends 'base/manager_base.html' %}

{% block title %}
Manager Dashboard
{% endblock %}

{% block content %}

<h2 class="mb-4">Manager Dashboard</h2>

<div class="row">

    <div class="col-md-3 mb-3">
        <div class="card shadow">
            <div class="card-body text-center">
                <h5>Total Sales</h5>
                <h2>{{ total_sales }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-3 mb-3">
        <div class="card shadow">
            <div class="card-body text-center">
                <h5>Total Orders</h5>
                <h2>{{ total_orders }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-3 mb-3">
        <div class="card shadow">
            <div class="card-body text-center">
                <h5>Total Revenue</h5>
                <h2>₹{{ total_revenue }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-3 mb-3">
        <div class="card shadow">
            <div class="card-body text-center">
                <h5>Total Stores</h5>
                <h2>{{ total_products }}</h2>
            </div>
        </div>
    </div>

</div>

{% endblock %}
