<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Analyst Panel{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #edf2f7;
        }
        .sidebar {
            min-height: 100vh;
            background: linear-gradient(180deg, #0b2240 0%, #132a55 100%);
        }
        .sidebar h3 {
            color: #ffffff;
            font-size: 1.4rem;
            letter-spacing: 0.03em;
        }
        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.85);
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            margin-bottom: 0.35rem;
        }
        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }
        .sidebar .nav-link.text-danger:hover {
            background: rgba(220, 38, 38, 0.12);
            color: #ffdddd;
        }
        .main-panel {
            min-height: 100vh;
            background: #f3f7fb;
            padding: 2rem 1.5rem;
        }
        .admin-card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
        }
        .admin-card h5 {
            color: #1f3a8a;
            font-weight: 700;
        }
        .admin-card h2 {
            color: #0f172a;
            margin-top: 0.75rem;
        }
    </style>
</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->

        <div class="col-md-2 bg-dark text-white min-vh-100">

            <h3 class="mt-3">Analyst Panel</h3>

            <hr>

            <ul class="nav flex-column">

                <li class="nav-item">
                    <a class="nav-link text-white" href="{% url 'analyst_dashboard' %}">
                        Dashboard
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white" href="{% url 'sales_trends' %}">
                        Sales Trends
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="{% url 'growth_analysis' %}">
                        Growth Analysis
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="{% url 'revenue_analysis' %}">
                        Revenue Analysis
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="{% url 'store_performance' %}">
                        Store Performance
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-danger" href="{% url 'logout' %}">
                        Logout
                    </a>
                </li>

            </ul>

        </div>

        <!-- Main Content -->

        <div class="col-md-10 p-4">

            {% block content %}
            {% endblock %}

        </div>

    </div>

</div>

</body>
</html>
