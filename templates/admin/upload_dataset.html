{% extends 'base/admin_base.html' %}

{% block title %}
Dataset Upload
{% endblock %}

{% block content %}

<h2>Upload Dataset</h2>

<form
    method="POST"
    enctype="multipart/form-data">

    {% csrf_token %}

    {{ form.as_p }}

    <button
        type="submit"
        class="btn btn-primary">

        Upload Dataset

    </button>

</form>

<hr>

{% if preview %}

<h3>Dataset Preview</h3>

{{ preview|safe }}

{% endif %}

{% endblock %}
