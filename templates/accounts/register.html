<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #eef3fb 0%, #dfe8f8 100%);
            color: #1f2d3d;
            display: flex;
            align-items:center;
            justify-content:center; 
        }

        .register-container {
            width: min(450px, calc(100% - 32px));
            padding: 36px 32px;
            background: #ffffff;
            border-radius: 22px;
            box-shadow: 0 24px 60px rgba(34, 70, 150, 0.12);
        }

        .register-container h1 {
            margin: 0 0 26px;
            font-size: 30px;
            text-align: center;
            color: #1c3a72;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        input, select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d6dde8;
            border-radius: 12px;
            background: #f7f9ff;
            font-size: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #6d8bf2;
            box-shadow: 0 0 0 4px rgba(109, 139, 242, 0.12);
            background: #ffffff;
        }

        button {
            width: 100%;
            padding: 14px 0;
            border: none;
            border-radius: 12px;
            background: #1f3a93;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background: #17307a;
        }

        .form-actions {
            margin-top: 20px;
            text-align: center;
            font-size: 0.95rem;
        }

        .form-actions a {
            color: #1f3a93;
            text-decoration: none;
            font-weight: 600;
        }

        .form-actions a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="register-container">
    <h1>User Registration</h1>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Register
        </button>
    </form>

    <div class="form-actions">
        Already have an account? <a href="{% url 'login' %}">Login</a>
    </div>
</div>

</body>
</html>
