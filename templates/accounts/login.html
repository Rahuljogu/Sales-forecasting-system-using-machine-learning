<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #eef3fb 0%, #dfe8f8 100%);
            color: #1f2d3d;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: min(420px, calc(100% - 32px));
            padding: 34px 30px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(34, 70, 150, 0.12);
        }

        .login-container h1 {
            margin: 0 0 24px;
            font-size: 30px;
            text-align: center;
            color: #1c3a72;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d6dde8;
            border-radius: 12px;
            background: #f7f9ff;
            font-size: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #6d8bf2;
            box-shadow: 0 0 0 4px rgba(109, 139, 242, 0.12);
            background: #ffffff;
        }

        button {
            width: 100%;
            padding: 14px 0;
            border: none;
            border-radius: 12px;
            background: #1f3a93;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background: #17307a;
        }

        .error {
            margin-top: 18px;
            color: #c0392b;
            text-align: center;
        }

        .register-link {
            margin-top: 20px;
            text-align: center;
            font-size: 0.95rem;
        }

        .register-link a {
            color: #1f3a93;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h1>Login</h1>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password">
        </div>

        <button type="submit">Login</button>
    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <p class="register-link">Not registered? <a href="{% url 'register' %}">Register</a></p>
    <div style="margin-top:20px; padding:12px; background:#eef6ff; border:1px solid #b6d4fe; border-radius:10px; text-align:center;">
    <strong>Admin Credentials</strong><br>
    <strong>Username:</strong> admin<br>
    <strong>Password:</strong> admin
</div>
</div>
</div>

</body>
</html>
