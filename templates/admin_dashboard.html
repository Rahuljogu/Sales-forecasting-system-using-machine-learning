<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #eef4fb;
        }
        .sidebar {
            min-height: 100vh;
            background: linear-gradient(180deg, #0e2a54 0%, #163763 100%);
        }
        .sidebar h3 {
            color: #ffffff;
            font-size: 1.45rem;
            letter-spacing: 0.04em;
        }
        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.9);
            border-radius: 0.5rem;
            margin-bottom: 0.25rem;
            transition: background-color 0.2s ease;
        }
        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
        }
        .navbar-danger:hover {
            background: rgba(248, 113, 113, 0.16);
            color: #fff;
        }
        .page-title {
            color: #102a43;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        .dashboard-card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
        }
        .dashboard-card h5 {
            color: #1e40af;
            font-weight: 700;
        }
        .dashboard-card h2 {
            margin-top: 0.75rem;
            color: #0f172a;
        }
        .dashboard-grid {
            gap: 1.5rem;
        }
    </style>
</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->

        <div class="col-md-2 bg-dark text-white min-vh-100">

            <h3 class="mt-3">Admin Panel</h3>

            <hr>

            <ul class="nav flex-column">

                <li class="nav-item">
                    <a class="nav-link text-white" href="#">
                        Dashboard
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white" href="{% url 'users' %}">
                        User Management
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white" href="{% url 'sales_data' %}">
                        Sales Data
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="{% url 'analytics' %}">
                        Analytics
                    </a>
                </li>

                

                <li class="nav-item">
                    <a class="nav-link text-white" href="{% url 'model_training' %}">
                        Model Training
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white" href="{% url 'predictions' %}">
                        Predictions
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="{% url 'prediction_history' %}">
                        Prediction History
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white" href="{% url 'reports' %}">
                        Reports
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-danger" href="{% url 'logout' %}">
                        Logout
                    </a>
                </li>

            </ul>

        </div>

        <!-- Main Content -->

        <div class="col-md-10">

            <div class="p-4">

                <h1>Welcome Admin</h1>

                <hr>

                <div class="row">

                    <div class="col-md-3">

                        <div class="card">
                            <div class="card-body">

                                <h5>Total Users</h5>

                                <h2>{{ total_users }}</h2>

                            </div>
                        </div>

                    </div>

                    <div class="col-md-3">

                        <div class="card">
                            <div class="card-body">

                                <h5>Total Sales</h5>

                                <h2>{{ total_sales }}</h2>

                            </div>
                        </div>

                    </div>

                    <div class="col-md-3">

                        <div class="card">
                            <div class="card-body">

                                <h5>Revenue</h5>

                                <h2>₹{{ total_revenue }}</h2>

                            </div>
                        </div>

                    </div>

                    <div class="col-md-3">

                        <div class="card">
                            <div class="card-body">

                                <h5>Accuracy</h5>

                                <h2>96%</h2>

                            </div>
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
